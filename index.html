<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive Property Plat Map</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f6;font-family:Arial,Helvetica,sans-serif;color:#222}.wrap{max-width:1050px;margin:0 auto;padding:20px 12px 40px}.map{position:relative;width:100%;margin:auto;line-height:0}.map>img{display:block;width:100%;height:auto}.marker{position:absolute;transform:translate(-50%,-50%);border:2px solid white;background:#eee;border-radius:50%;width:clamp(28px,4vw,44px);height:clamp(28px,4vw,44px);padding:0;overflow:hidden;box-shadow:0 2px 10px #0009;cursor:pointer;z-index:1;touch-action:manipulation}.marker img{width:100%;height:100%;object-fit:cover;pointer-events:none}.marker:hover,.marker:focus-visible{outline:2px solid #2563eb;outline-offset:2px;transform:translate(-50%,-50%) scale(1.13)}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:1000;display:none;align-items:center;justify-content:center;padding:70px 18px 35px}.overlay.active{display:flex}.overlay img{display:block;max-width:100%;max-height:calc(100vh - 125px);object-fit:contain;box-shadow:0 8px 40px #0008}.close{position:absolute;right:20px;top:16px;color:#111;background:white;border:0;border-radius:50%;width:44px;height:44px;font-size:30px;line-height:1;cursor:pointer}.caption{position:absolute;top:23px;left:20px;color:white;font-size:16px;max-width:calc(100% - 110px)}body.modal-open{overflow:hidden}
</style></head><body><main class="wrap"><div class="map" aria-label="Property plat map with clickable photo markers"><img src="plat-map.png" alt="Property plat map">
<button class="marker" style="left:15.01124351%;top:30.33571343%" data-src="photo-1.jpg" data-name="A spacious metal workspace features 5 roll-up doors and a gravel drive." aria-label="View Marker 1"><img src="photo-1.jpg" alt="" loading="lazy"></button>
<button class="marker" style="left:63.92746198%;top:74.49522981%" data-src="photo-2.png" data-name="The property features an 5040 SqFt existing building and offers potential for a variety of uses, including a barndominium-style development, small industrial warehouses, flex spaces, or commercial business operations. " aria-label="View Marker 2"><img src="photo-2.png" alt="" loading="lazy"></button>
<button class="marker" style="left:59.87574184%;top:13.81967779%" data-src="photo-3.jpg" data-name="Aerial View from Highway 290" aria-label="View Marker 3"><img src="photo-3.jpg" alt="" loading="lazy"></button>
<button class="marker" style="left:78.77005286%;top:86.27445098%" data-src="photo-4.jpg" data-name="Commercial/investment land with development potential on approximately 11.57 acres with direct US-290 frontage in Paige." aria-label="View Marker 4"><img src="photo-4.jpg" alt="" loading="lazy"></button>
</div></main><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Property photo viewer"><div class="caption" id="caption"></div><button class="close" id="close" aria-label="Close photo">&times;</button><img id="large" alt="Property photograph"></div><script>
const overlay=document.getElementById('overlay'),large=document.getElementById('large'),caption=document.getElementById('caption'),close=document.getElementById('close');let previous=null;
document.querySelectorAll('.marker').forEach(button=>button.addEventListener('click',()=>{previous=button;large.src=button.dataset.src;large.alt=button.dataset.name;caption.textContent=button.dataset.name;overlay.classList.add('active');document.body.classList.add('modal-open');close.focus()}));
function hide(){overlay.classList.remove('active');document.body.classList.remove('modal-open');large.removeAttribute('src');if(previous)previous.focus()}
close.addEventListener('click',hide);overlay.addEventListener('click',e=>{if(e.target===overlay)hide()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('active'))hide();if(e.key==='Tab'&&overlay.classList.contains('active')){e.preventDefault();close.focus()}});
</script></body></html>
